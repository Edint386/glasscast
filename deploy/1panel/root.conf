# glasscast（可选变体：1Panel 面板建站，见 docs/deploy.md「1Panel 用户」）
#
# 用途：替换 1Panel「网站 → 反向代理」为你的域名生成的 root.conf，位置一般是
#   /opt/1panel/apps/openresty/openresty/www/sites/<你的域名>/proxy/root.conf
# 证书和 HTTP→HTTPS 跳转仍由 1Panel 的网站设置管理（不要在 1Panel 里开启 HTTP3）。
# 依赖：conf.d 里的 glasscast-upstream.conf（upstream glasscast_tunnel），用
#   sh deploy/server-setup.sh --render ./out --flavor 1panel --domain <你的域名>
# 渲染得到，复制到 /opt/1panel/apps/openresty/openresty/conf/conf.d/。
# 注意：之后在 1Panel 面板里再修改这个反向代理时，面板会重写本文件，改完要重新粘贴。
# 本文件不含域名、端口，不需要修改。

# /admin 是 glasscast 给电脑本机用的管理接口（glasscast set-fps / config），公网一律 404。
location ^~ /admin/ {
    return 404;
}

location ^~ / {
    # 1Panel 默认给站点开访问日志，而图片地址里的 key 相当于看屏口令，这里关掉
    access_log off;
    proxy_pass http://glasscast_tunnel;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # 池里的旧连接（隧道重连后）失败时换另一个 peer 重发一次；POST 也重发（non_idempotent），
    # glasscast 的 MCP 工具重复执行都安全（start_cast / stop_cast / cast_status）。
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 4s;
}
