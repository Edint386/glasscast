[project]
name = "glasscast"
version = "0.1.0"
description = "Cast your computer screen to Qwen AI glasses S1 (千问 AI 眼镜): small grayscale JPEGs served over HTTPS, controlled by voice through an MCP plugin on the Qwen AI hardware open platform"
readme = "README.md"
license = "MIT"
authors = [{ name = "Edint386" }]
requires-python = ">=3.12"
keywords = [
    "qwen",
    "qwen-ai-glasses",
    "smart-glasses",
    "screen-cast",
    "screen-mirroring",
    "mcp",
    "model-context-protocol",
    "waft",
    "千问",
    "AI眼镜",
    "投屏",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "mss>=9.0,<12",
    "Pillow>=10.0",
    "mcp>=2.3,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Edint386/glasscast"
Repository = "https://github.com/Edint386/glasscast"
Issues = "https://github.com/Edint386/glasscast/issues"
Documentation = "https://github.com/Edint386/glasscast#readme"

[project.scripts]
glasscast = "glasscast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glasscast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
